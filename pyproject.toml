[project]
name = "flasknova"
version = "0.2.0"
description = "Extra check using validators in flask application"
authors = [
    {name = "manitreasure1",email = "manitreasure1@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "pydantic>=2.13.4",
]

[project.scripts]
flask_nova = "flask_nova:cli"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_nova/"]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src/flask_nova"]

[project.urls]
Homepage = "https://github.com/manitreasure1/flasknova"
Documentation = "https://github.com/manitreasure1.github.io/flasknova"
Repository = "https://github.com/manitreasure1/flasknova"
Issues = "https://github.com/manitreasure1/flasknova/issues"

[tool.hatch.build.targets.sdist]
include = [
    "src/flask_nova",
    "README.md",
    "LICENSE",
]
